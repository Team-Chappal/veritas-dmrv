# Publish the demo image so a judge can run ONE command, with no clone and no
# build step. `docker compose up` is verified and is the right exit criterion, but
# it is not a demo: a judge with 30 seconds will not run an 8-minute build.
name: Publish demo image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    name: Build and push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/veritas-frontend:latest
            ghcr.io/${{ github.repository_owner }}/veritas-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/veritas-backend:latest
            ghcr.io/${{ github.repository_owner }}/veritas-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record the run command in the job summary
        run: |
          {
            echo "### Demo image published"
            echo
            echo '```bash'
            echo "docker compose up"
            echo "# or, pulling the published images:"
            echo "docker run -p 3000:3000 -p 8000:8000 \\"
            echo "  ghcr.io/${{ github.repository_owner }}/veritas-frontend:latest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
