name: VERITAS dMRV CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# The fixture-freshness gate is separate and runs FIRST: if the committed solar
# fixtures are stale, the physics tests are validating against numbers nobody
# has checked, and a green run would be meaningless.
jobs:
  fixtures-fresh:
    name: Solar fixtures are pvlib-generated and current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install physics deps
        run: |
          python -m pip install --upgrade pip
          pip install pvlib==0.11.1 pandas numpy pytest
      - name: Verify committed fixtures match a fresh pvlib run
        run: python scripts/gen_solar_fixtures.py --check

  backend-tests:
    name: Backend suite (85% coverage gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install system deps for OpenCV headless
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-0 libsm6 libxext6 libxrender-dev libgomp1
      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pytest-cov freezegun
      - name: Run suite with coverage
        run: pytest backend/tests -v --cov=backend --cov-report=xml --cov-fail-under=85

  no-network-in-tests:
    name: Tests pass with Cloudinary credentials absent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-0 libsm6 libxext6 libxrender-dev libgomp1
          pip install -r backend/requirements.txt
      - name: Run with all CLOUDINARY_* explicitly unset
        env:
          PYTHONPATH: backend
          CLOUDINARY_CLOUD_NAME: ""
          CLOUDINARY_API_KEY: ""
          CLOUDINARY_API_SECRET: ""
        run: |
          pytest backend/tests -q
          python -c "
          from core.config import get_settings
          s = get_settings()
          assert not s.has_cloudinary_credentials, 'credentials leaked into CI'
          assert s.mode == 'fixture'
          print('fixture-mode degradation OK:', s.public_summary())
          "
      - name: Doc claim linter
        run: python scripts/verify_docs.py

  frontend-build:
    name: Next.js production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package.json
      # npm ci, not npm install: the lockfile is committed now, and `install`
      # silently updates it, which is how a build ends up depending on packages
      # nobody pinned.
      - name: Install dependencies
        run: npm --prefix frontend ci --no-audit --no-fund
      - name: Build
        run: npm --prefix frontend run build
      - name: Typecheck
        run: npm --prefix frontend run typecheck

  frontend-e2e:
    name: Playwright e2e (backend absent)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm --prefix frontend ci --no-audit --no-fund
      - name: Install Chromium
        run: npx --prefix frontend playwright install --with-deps chromium
      # No backend service here, deliberately. S6 exit criterion 5 is that the
      # demo works with the backend entirely absent, so a suite that needed one
      # would be testing the wrong thing.
      - name: E2E
        run: npm --prefix frontend run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  load-test:
    name: Load test (500 assets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install --upgrade pip
          backend/.venv/bin/pip install -r backend/requirements.txt
      - name: Load test
        # 500 assets at 640x360, both injections on. The quick configuration:
        # the full-resolution run takes ~8 minutes and belongs on a machine, not
        # in CI. The point of having it here is that it FAILS LOUDLY -- a
        # regression that made the corpus quietly all-pass would break the
        # verdict-coverage assertion rather than passing unnoticed.
        run: make load-test-quick
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-test
          path: docs/load-test.json
          retention-days: 7

  # Runs AFTER the push, because GitHub is what accepts it. This makes the commit
  # VISIBLE rather than preventing it: ci-gate.py protects merges, and nothing
  # protected pushes -- which is how dc26c66 and d26b589 both reached main with
  # no PR and no CI.
  #
  # It runs on BOTH events on purpose. An earlier version was gated behind
  # `if: push`, so on every pull request it reported SKIPPED -- and ci-gate.py
  # counts skipped as failure, which meant the new job made the repository
  # unmergeable. A guard that cannot run on the event it is most needed for is
  # worse than no guard: it makes the honest path impossible.
  #
  #   push        -> the head of main must carry a merged PR reference
  #   pull_request -> main must be compliant RIGHT NOW, plus a self-test, so the
  #                   guard is exercised before it is ever relied upon
  check-main-provenance:
    name: Every commit on main came from a merged PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Assert the head of main carries a merged PR
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/check_main_provenance.py --ref HEAD
      - name: Assert main is currently compliant
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/check_main_provenance.py --ref origin/main
      - name: Self-test the guard against the commits that slipped through
        if: github.event_name != 'push'
        run: python -m pytest backend/tests/test_push_guard.py -q
